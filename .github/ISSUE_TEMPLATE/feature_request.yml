name: Sugerir melhoria
description: Explique um caso de uso e uma mudança desejada.
title: "[Melhoria]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema ou necessidade
      description: Qual tarefa está difícil ou impossível hoje?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solução proposta
      description: Descreva o comportamento que espera.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidade
      options:
        - label: Não incluí credenciais, dados pessoais ou conteúdo privado.
          required: true

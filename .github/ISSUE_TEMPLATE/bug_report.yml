name: Relatar defeito
description: Informe um problema reproduzível no Vladmir.
title: "[Defeito]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Não inclua senhas, tokens, endereços privados, conteúdo de conversas ou arquivos pessoais.
        Para vulnerabilidades, use o processo privado descrito em SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Versão ou commit
      description: Informe a versão do Vladmir ou o hash do commit.
      placeholder: hash curto ou versão
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Sistema e dispositivo
      placeholder: Distribuição Linux, versão Android ou modelo relevante
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Liste os passos mínimos e sanitizados.
      placeholder: 1. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado observado
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Mensagem de erro ou log sanitizado
      description: Remova tokens, endereços, nomes pessoais e conteúdo privado.
    validations:
      required: false
